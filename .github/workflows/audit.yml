name: Audit

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock]
  pull_request:
    paths: [Cargo.toml, Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # cargo audit only reads Cargo.lock and builds nothing, so this needs no
    # macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
