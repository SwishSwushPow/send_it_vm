# sendit (sendit-vm/, the crate send_it_vm) and its desktop app (sendit-ui/)
# share one Cargo.lock and target/. Plain `cargo build/test/clippy` here builds
# sendit alone, as CI does; pass --workspace for both, or -p sendit-ui for the
# app.
[workspace]
members = ["sendit-vm", "sendit-ui"]
default-members = ["sendit-vm"]
resolver = "3"

[profile.release]
# rustc's strip step runs after the linker and would replace the signature
# (with the virtualization entitlement) that scripts/link-and-sign.sh adds.
strip = false
